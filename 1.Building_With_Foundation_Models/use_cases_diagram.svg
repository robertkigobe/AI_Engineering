<text x="584" y="260" font-size="13" fill="#374151">Summarise articles, chat with docs</text>
<text x="584" y="280" font-size="11" font-weight="700" fill="#0d9488">ENTERPRISE</text>
<text x="584" y="296" font-size="13" fill="#374151">Meeting notes, market research</text>
<rect x="570" y="316" width="250" height="118" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<circle cx="592" cy="340" r="13" fill="#0d9488"/>
<text x="592" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text>
<text x="612" y="346" font-size="16" font-weight="700" fill="#111827">Data organization</text>
<text x="584" y="376" font-size="11" font-weight="700" fill="#0d9488">CONSUMER</text>
<text x="584" y="392" font-size="13" fill="#374151">Search photos, sort files</text>
<text x="584" y="412" font-size="11" font-weight="700" fill="#0d9488">ENTERPRISE</text>
<text x="584" y="428" font-size="13" fill="#374151">Extract data from invoices/forms</text>
<rect x="840" y="184" width="250" height="118" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<circle cx="862" cy="208" r="13" fill="#ea580c"/>
<text x="862" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">8</text>
<text x="882" y="214" font-size="16" font-weight="700" fill="#111827">Workflow automation</text>
<text x="854" y="244" font-size="11" font-weight="700" fill="#ea580c">CONSUMER</text>
<text x="854" y="260" font-size="13" fill="#374151">Book travel, plan tasks</text>
<text x="854" y="280" font-size="11" font-weight="700" fill="#ea580c">ENTERPRISE</text>
<text x="854" y="296" font-size="13" fill="#374151">Leads, data entry, AI agents</text>
<rect x="30" y="590" width="1060" height="150" rx="12" fill="#f9fafb" stroke="#d1d5db"/>
<text x="48" y="620" font-size="16" font-weight="700" fill="#111827">Remember</text>
<text x="48" y="646" font-size="14" fill="#374151">• <tspan font-weight="700" fill="#111827">Create → Converse → Organize → Act:</tspan> AI goes from making things to doing things for you.</text>
<text x="48" y="666" font-size="14" fill="#374151">• <tspan font-weight="700" fill="#111827">Coding</tspan> is the most popular, proven use case so far.</text>
<text x="48" y="686" font-size="14" fill="#374151">• <tspan font-weight="700" fill="#111827">Enterprises start internal</tspan> (lower risk) before customer-facing apps.</text>
<text x="48" y="706" font-size="14" fill="#374151">• <tspan font-weight="700" fill="#111827">Agents (Act)</tspan> are the most ambitious: the model takes actions, not just answers.</text>
<text x="48" y="726" font-size="14" fill="#374151">• <tspan font-weight="700" fill="#111827">Same toolkit everywhere:</tspan> prompt engineering, RAG, finetuning, agents.</text>
</svg>