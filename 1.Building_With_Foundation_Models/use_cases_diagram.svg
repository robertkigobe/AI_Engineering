<text x="314" y="260" font-size="13" fill="#374151">Tutoring, homework, languages</text>
<text x="314" y="280" font-size="11" font-weight="700" fill="#7c3aed">ENTERPRISE</text>
<text x="314" y="296" font-size="13" fill="#374151">Staff training, onboarding</text>
<rect x="300" y="316" width="250" height="118" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<circle cx="322" cy="340" r="13" fill="#7c3aed"/>
<text x="322" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
<text x="342" y="346" font-size="16" font-weight="700" fill="#111827">Conversational bots</text>
<text x="314" y="376" font-size="11" font-weight="700" fill="#7c3aed">CONSUMER</text>
<text x="314" y="392" font-size="13" fill="#374151">Chatbots, AI companions</text>
<text x="314" y="412" font-size="11" font-weight="700" fill="#7c3aed">ENTERPRISE</text>
<text x="314" y="428" font-size="13" fill="#374151">Customer support, assistants</text>
<rect x="570" y="184" width="250" height="118" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
<circle cx="592" cy="208" r="13" fill="#0d9488"/>
